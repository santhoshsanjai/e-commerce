version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "angular-eslint", "@angular-eslint/*"]
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: ["/backend", "/frontend", "/ops"]
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directories: ["/infra/terraform/bootstrap", "/infra/terraform/envs/staging", "/infra/terraform/modules/shop"]
    schedule: { interval: weekly }
