name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ecommerce_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy app
      - name: Migrations are in sync with models
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ecommerce
        run: uv run alembic upgrade head && uv run alembic check && uv run alembic downgrade base
      - name: Tests
        run: uv run pytest

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22.23"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t ecommerce-api backend
      - run: docker build --build-arg APP=buyer -t ecommerce-buyer frontend
      - run: docker build --build-arg APP=admin -t ecommerce-admin frontend

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
      - name: Python dependencies
        working-directory: backend
        run: uv export --frozen --no-dev --format requirements-txt > /tmp/req.txt && uvx pip-audit -r /tmp/req.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22.23"
      - name: Node dependencies (production)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
