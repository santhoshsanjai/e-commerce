# Full local stack: `docker compose up --build`
#   Buyer site  http://localhost:4200
#   Admin       http://localhost:4300
#   API docs    http://localhost:8000/docs
#   Media (S3)  http://localhost:8333/product-media
#   Emails      http://localhost:8025 (Mailpit)
name: ecommerce

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &api-env
      ENVIRONMENT: local
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/ecommerce
      CORS_ORIGINS: '["http://localhost:4200","http://localhost:4300"]'
      S3_ENDPOINT_URL: http://s3:8333
      S3_ACCESS_KEY: local
      S3_SECRET_KEY: local
      MEDIA_PUBLIC_BASE_URL: http://localhost:8333/product-media
      EMAIL_BACKEND: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    environment:
      <<: *api-env
      # Local only: the web containers' addresses change, so trust any proxy.
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      s3-setup:
        condition: service_completed_successfully

  # Catches every email the app sends. Read them at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

  # S3-compatible storage for product media (AWS S3 or similar in deployed environments).
  # Local only: SeaweedFS's S3 gateway with no credentials configured, so objects are public.
  s3:
    image: chrislusf/seaweedfs:4.53
    command: ["server", "-s3", "-dir=/data"]
    ports:
      - "8333:8333"
    volumes:
      - s3data:/data

  # Creates the public media bucket and the private files bucket once S3 is up.
  s3-setup:
    build: ./backend
    command:
      - python
      - -c
      - |
        import time, boto3
        s3 = boto3.client("s3", endpoint_url="http://s3:8333", region_name="us-east-1",
                          aws_access_key_id="local", aws_secret_access_key="local")
        for _ in range(60):
            try:
                s3.list_buckets(); break
            except Exception:
                time.sleep(1)
        existing = [b["Name"] for b in s3.list_buckets()["Buckets"]]
        for bucket in ("product-media", "private-files"):
            if bucket not in existing:
                s3.create_bucket(Bucket=bucket)
        print("buckets ready")
    depends_on:
      - s3

  buyer:
    build:
      context: ./frontend
      args:
        APP: buyer
    ports:
      - "4200:80"
    depends_on:
      - api

  admin:
    build:
      context: ./frontend
      args:
        APP: admin
    ports:
      - "4300:80"
    depends_on:
      - api

volumes:
  pgdata:
  s3data:
