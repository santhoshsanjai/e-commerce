# Serves the Angular build and proxies /api to the backend, so the browser sees one origin.
#
# Security headers are repeated in every location on purpose: nginx drops the server-level
# add_header lines in any location that has add_header of its own.
#
# MEDIA_ORIGIN is where product images are served from (the CDN in deployed environments).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: ${MEDIA_ORIGIN}; media-src 'self' ${MEDIA_ORIGIN}; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # Courier files can be a few MB; nothing the API accepts is larger than product images.
        client_max_body_size 12m;
    }

    # Product videos (up to 100 MB) are the one bigger upload; they stream to the API unbuffered.
    location ~ ^/api/v1/admin/products/[^/]+/videos$ {
        proxy_pass ${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        client_max_body_size 105m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # Hashed assets can be cached for a year; index.html must always be revalidated.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ /index.html;
    }
}
